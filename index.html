<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nacho ~ Indumentaria. Ropa y accesorios con estilo.">
    <title>Nacho ~ Indumentaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 id="h1">Nacho ~ Indumentaria</h1>
    </header>
    <main>
        <section id="tienda">
            <h2>Productos</h2>
            <div id="contenedor-productos"></div>
        </section>
        <section id="carrito">
            <h2>Carrito</h2>
            <ul id="lista-carrito"></ul>
            <p><strong>Total: $</strong><span id="total-precio">0</span></p>
            <button id="btn-finalizar">Finalizar Compra</button>
        </section>
    </main>
    <footer class="footer-restablecer">
        <button type="button" id="btn-restablecer-stock">Restablecer stock</button>
    </footer>
</body>
</html>
